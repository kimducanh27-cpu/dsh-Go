# Builds a test APK (release arm64, debug-signed) for the personal fork:
# runtime first (runtime/build-runtime.sh), then tooling/build-apk.sh.
# No key.properties on this fork, so the release build falls back to the
# debug signing key — fine for a personal install, NOT for an official release
# (see docs/release.md: official releases need the fixed release key).
# Run manually: Actions -> Build APK -> Run workflow.
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  NDK_VERSION: 28.2.13676358
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Downloads are verified by hash on every run, so a stale cache is harmless.
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-
      - name: Build the arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a
      - name: Check the bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64
      - name: Save the download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # gradlew is not tracked, so Gradle comes from here.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # tawcroot (runtime/tawcroot/build.py) needs the pinned NDK. The runner
      # image pre-installs its own NDK and sets ANDROID_NDK_HOME to it, which
      # build.py prefers over the SDK's ndk/<pinned> dir — so install the
      # pinned one, verify it, and point ANDROID_NDK_HOME at it explicitly.
      # NOTE: no `yes |` in front of sdkmanager — it never prompts for a
      # license here, and with pipefail the `yes` process dying of SIGPIPE
      # after a successful install fails the whole step (run #3, 20/11).
      # NOTE (run #5, 20/11): sdkmanager itself was FINE (rc=0, "complete" /
      # "finished") — the step failed on MY OWN verify grep: NDK writes
      # `Pkg.Revision = 28.2.13676358` (spaces around `=`), but the grep
      # looked for `Pkg.Revision=...` (no spaces) and never matched. Fix:
      # tolerate optional spaces around `=`, and print the NDK dir contents
      # first so a future verify failure is self-explanatory in the log.
      - name: Install pinned NDK
        run: |
          set +e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --verbose --sdk_root="$ANDROID_HOME" "ndk;${{ env.NDK_VERSION }}"
          SDKMANAGER_RC=$?
          set -e
          echo "sdkmanager exit code: $SDKMANAGER_RC"
          NDK="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          echo "--- $NDK/source.properties ---"
          cat "$NDK/source.properties" || echo "(missing source.properties)"
          echo "--- clang ---"
          ls -l "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || echo "(missing clang)"
          if grep -Eq "^Pkg\.Revision *= *${{ env.NDK_VERSION }} *$" "$NDK/source.properties" && test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
            echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
            echo "NDK verified: $NDK (sdkmanager rc=$SDKMANAGER_RC)"
          else
            echo "::error::NDK ${{ env.NDK_VERSION }} did not verify after sdkmanager (rc=$SDKMANAGER_RC)"
            exit 1
          fi
      - name: Build APK
        run: tooling/build-apk.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 14
          if-no-files-found: error
